# In-Cluster Load Generator Job
# Runs k6 co-located on the same compute node pool (e.g. AWS c6i.2xlarge in us-east-1d)
# CRITICAL: Do NOT test via kubectl port-forward, which routes through the Kubernetes
# API server tunnel and adds multi-millisecond client proxy jitter.
apiVersion: batch/v1
kind: Job
metadata:
  name: loadgen-k6-benchmark
  namespace: model-serving-benchmark
  labels:
    app.kubernetes.io/name: loadgen-k6-benchmark
    app.kubernetes.io/component: loadgen
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loadgen-k6-benchmark
        app.kubernetes.io/component: loadgen
    spec:
      restartPolicy: Never
      # Hardware & Zone Co-location: Run in the same zone as model servers
      nodeSelector:
        node.kubernetes.io/instance-type: c6i.2xlarge
        topology.kubernetes.io/zone: us-east-1d
      containers:
        - name: k6
          image: grafana/k6:0.54.0
          args:
            - run
            - /scripts/k6_benchmark.js
          env:
            # Change TARGET_HOST to test the desired architecture:
            # Architecture A: http://direct-serving-svc:8000
            # Architecture B: http://ray-serve-python-proxy-serve-svc:8000
            # Architecture C: http://ray-serve-worker-haproxy-svc:8000
            - name: TARGET_HOST
              value: "http://ray-serve-worker-haproxy-svc:8000"
            - name: INFER_PATH
              value: "/infer"
            - name: RATE_RPS
              value: "50"
            - name: STAGE_DURATION
              value: "30s"
          resources:
            requests:
              cpu: "1000m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          volumeMounts:
            - name: script-volume
              mountPath: /scripts/k6_benchmark.js
              subPath: k6_benchmark.js
            - name: fixtures-volume
              mountPath: /scripts/fixtures/sample_payloads.jsonl
              subPath: sample_payloads.jsonl
      volumes:
        - name: script-volume
          configMap:
            name: k6-benchmark-script
        - name: fixtures-volume
          configMap:
            name: k6-benchmark-fixtures
